version: 2

models:
  - name: stg_crm_customers
    description: Latest cleaned customer record per customer_id from CRM source.
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: email
        tests: [not_null]
  - name: stg_mdm_products
    description: Latest cleaned product record per product_id from product master.
    columns:
      - name: product_id
        tests: [not_null, unique]
  - name: stg_erp_orders
    description: Deduplicated order lines with quantity and amount calculations.
    columns:
      - name: order_line_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
  - name: stg_web_events
    description: Deduplicated website events by event_id.
    columns:
      - name: event_id
        tests: [not_null, unique]
  - name: stg_support_tickets
    description: Latest ticket status and resolution timing.
    columns:
      - name: ticket_id
        tests: [not_null, unique]
